<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>ログイン</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

<div class="card">

    <h1>ログイン</h1>

    <form action="/login" method="POST">

        <p>ユーザー名</p>
        <input type="text" name="username">

        <p>パスワード</p>
        <input type="password" name="password">

        <button type="submit">
            ログイン
        </button>

    </form>

    <br>

    <a href="/register">
        新規登録
    </a>

</div>

</div>

</body>
</html>
